<!-- @dsCard group="Spacing" viewport="700x170" name="Motion" subtitle="pulse-dot · slide-up · modal-enter · toast-enter · logo-roll" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:#fff;font:var(--type-body)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{width:104px}.chip{height:56px;border-radius:var(--radius-md)}.n{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--color-primary);margin-top:6px;display:block}.h{font-family:var(--font-mono);font-size:9px;color:var(--color-muted);display:block}</style></head><body><div style="display:flex;flex-direction:column;gap:8px;font-family:var(--font-mono);font-size:10px;color:var(--color-primary)">
<div style="display:flex;align-items:center;gap:10px"><span style="width:8px;height:8px;border-radius:50%;background:var(--color-accent);animation:pulse-dot 2s var(--ease-pulse) infinite"></span>pulse-dot · 2s · live status</div>
<div style="display:flex;align-items:center;gap:10px"><span style="padding:2px 8px;background:var(--color-soft);border:1px solid var(--color-line);border-radius:3px;animation:slide-up .3s var(--ease-overshoot) infinite alternate">slide-up</span>0.3s · overshoot · panels</div>
<div style="color:var(--color-muted)">modal-enter 0.35s cubic-bezier(.34,1.56,.64,1)</div>
<div style="color:var(--color-muted)">toast-enter 0.3s ease-out</div>
<div style="color:var(--color-muted)">logo-roll 0.7s overshoot — brand mark entrance</div>
</div></body></html>
