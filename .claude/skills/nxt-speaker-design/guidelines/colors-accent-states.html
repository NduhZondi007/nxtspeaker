<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:#fff;font:var(--type-body)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{width:104px}.chip{height:56px;border-radius:var(--radius-md)}.n{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--color-primary);margin-top:6px;display:block}.h{font-family:var(--font-mono);font-size:9px;color:var(--color-muted);display:block}</style></head><body><div class="sw"><div class="s"><div class="chip" style="background:var(--color-accent);"></div><span class="n">Default</span><span class="h">#FF5700</span></div><div class="s"><div class="chip" style="background:var(--color-accent-hover);"></div><span class="n">Hover</span><span class="h">#E64E00</span></div><div class="s"><div class="chip" style="background:var(--color-accent-disabled);"></div><span class="n">Disabled</span><span class="h">#FFD9C7</span></div><div class="s"><div class="chip" style="background:var(--color-accent-disabled-text);"></div><span class="n">Disabled text</span><span class="h">#B53E00</span></div></div>
