<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:#fff;font:var(--type-body)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{width:104px}.chip{height:56px;border-radius:var(--radius-md)}.n{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--color-primary);margin-top:6px;display:block}.h{font-family:var(--font-mono);font-size:9px;color:var(--color-muted);display:block}</style></head><body><div style="display:flex;gap:16px">
<div style="width:220px;background:#fff;border:1px solid var(--color-line);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:16px;display:flex;flex-direction:column;gap:8px">
<span style="align-self:flex-start;padding:2px 8px;border-radius:var(--radius-pill);background:var(--color-support);color:var(--color-primary);font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.2em">Strategy</span>

<div style="display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--color-line)">

<ul style="margin:0;padding-left:18px;font-size:13px;color:var(--color-muted);line-height:1.9;font-family:var(--font-mono)">
<li>padding 16</li><li>stack gap 8</li><li>footer rule padding-top 12</li><li>grid gutter 16–24</li></ul>
</div></body></html>
