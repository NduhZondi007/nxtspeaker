<!-- @dsCard group="Colors" viewport="700x150" name="Focus & selection" subtitle="Orange focus ring at 20%, orange selection fill" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:#fff;font:var(--type-body)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{width:104px}.chip{height:56px;border-radius:var(--radius-md)}.n{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--color-primary);margin-top:6px;display:block}.h{font-family:var(--font-mono);font-size:9px;color:var(--color-muted);display:block}</style></head><body><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
<input placeholder="Resting" style="padding:10px 12px;font:var(--type-small);border:1px solid var(--color-secondary);border-radius:4px;color:var(--color-primary);outline:none">
<input placeholder="Focused" style="padding:10px 12px;font:var(--type-small);border:1px solid var(--color-accent);border-radius:4px;box-shadow:0 0 0 2px rgba(255,87,0,.2);color:var(--color-primary);outline:none">
<input placeholder="Error" style="padding:10px 12px;font:var(--type-small);border:1px solid var(--color-danger);border-radius:4px;box-shadow:0 0 0 2px rgba(196,122,106,.2);color:var(--color-primary);outline:none">
<span style="padding:4px 8px;background:var(--color-accent);color:#fff;font:var(--type-small);border-radius:2px">selected text</span>
</div></body></html>
