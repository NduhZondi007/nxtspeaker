<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 16px;background:#fff;font:var(--type-body)}.sw{display:flex;gap:10px;flex-wrap:wrap}.s{width:104px}.chip{height:56px;border-radius:var(--radius-md)}.n{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--color-primary);margin-top:6px;display:block}.h{font-family:var(--font-mono);font-size:9px;color:var(--color-muted);display:block}</style></head><body><div class="sw"><div class="s"><div class="chip" style="background:var(--color-success);"></div><span class="n">Success</span><span class="h">#6B9E78</span></div><div class="s"><div class="chip" style="background:var(--color-danger);"></div><span class="n">Danger</span><span class="h">#C47A6A</span></div><div class="s"><div class="chip" style="background:var(--color-primary-hover);"></div><span class="n">Primary hover</span><span class="h">#021540</span></div><div class="s"><div class="chip" style="background:var(--color-support-hover);"></div><span class="n">Lavender hover</span><span class="h">#E0C4EF</span></div></div></body></html>
