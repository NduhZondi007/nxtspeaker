<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>NXT Speaker — Book Speakers Directly</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0}@keyframes spin{to{transform:rotate(360deg)}}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Sections.jsx"></script>
<script type="text/babel" src="Pages.jsx"></script>
<script type="text/babel">
const {ToastStack}=window.NXTSpeakerDesignSystem_f20208;
function App(){
  const [page,setPage]=React.useState('home');
  const [speaker,setSpeaker]=React.useState(null);
  const [booking,setBooking]=React.useState(false);
  const [toasts,setToasts]=React.useState([]);
  React.useEffect(()=>{window.scrollTo(0,0)},[page]);
  function openSpeaker(s){setSpeaker(s);setPage('profile')}
  function submit(){setBooking(false);
    setToasts([{id:String(Date.now()),type:'success',title:'Request sent',
      message:(speaker?speaker.name.split(' ')[0]:'The speaker')+' replies within 48 hours.'}]);}
  return <>
    <window.Nav page={page} onNavigate={setPage}/>
    {page==='home'&&<>
      <window.Hero onNavigate={setPage}/>
      <window.Featured onNavigate={setPage} onOpen={openSpeaker}/>
      <window.HowItWorks/>
      <window.ForSpeakers onNavigate={setPage}/>
    </>}
    {page==='speakers'&&<window.SpeakersPage onOpen={openSpeaker}/>}
    {page==='profile'&&<window.ProfilePage speaker={speaker} onBook={()=>setBooking(true)}/>}
    {page==='how'&&<window.HowItWorks/>}
    {page==='forspeakers'&&<window.ForSpeakers onNavigate={setPage}/>}
    {page==='login'&&<window.LoginPage onNavigate={setPage}/>}
    <window.Footer/>
    <window.BookingModal open={booking} speaker={speaker} onClose={()=>setBooking(false)} onSubmit={submit}/>
    <ToastStack toasts={toasts} onDismiss={id=>setToasts(t=>t.filter(x=>x.id!==id))}/>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
